name: lifezen_app
description: "A simple student daily-life planner built with Flutter."
publish_to: 'none'

version: 2.1.1+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  image_picker: ^1.1.2
  webview_flutter: ^4.13.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  gal: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/download.png"
  min_sdk_android: 21
